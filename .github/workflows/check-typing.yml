name: Check typing

on:
  push:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  AutomatedTesting:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install mypy
      run: |
        python -m pip install --upgrade pip
        pip install mypy
    - name: Install package and dependencies
      run: |
        python -m pip install .
    - name: Check typing
      run: |
        mypy src/jaxmaterials
