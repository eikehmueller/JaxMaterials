name: Automated tests

on:
  push:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  AutomatedTesting:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install MPI
      run: |
        sudo apt-get update
        sudo apt-get install -y openmpi-bin libopenmpi-dev
    - name: Install pytest
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install pytest-cov
        pip install mpi4py
    - name: Install package and dependencies
      run: |
        python -m pip install .
    - name: Run sequential tests with pytest
      env:
          PYTEST_ADDOPTS: "--color=yes --disable-warnings"
      run: |
        pytest -v -m "not parallel" --capture=fd --cov=jaxmaterials
        echo ""
        echo "**** detailled log ****"
        echo ""
        cat testoutput.txt
    - name: Run MPI parallel tests with pytest
      env:
          PYTEST_ADDOPTS: "--color=yes --disable-warnings"
      run: |
        mpiexec --oversubscribe  -n 6 pytest -v -m 'parallel[match]' --capture=fd --cov=jaxmaterials
        echo ""
        echo "**** detailled log ****"
        echo ""
        cat testoutput.txt
